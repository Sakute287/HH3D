<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH3D Auto Tool - Chỉ hỗ trợ hoathinh3d</title>
    <style>
        :root {
            --bg-primary: #100e0c;
            --bg-card: rgba(26, 22, 18, 0.94);
            --text-primary: #f4efe6;
            --text-secondary: #cbbfae;
            --accent: #e0b15a;
            --accent-deep: #a9782d;
            --border-color: rgba(224, 177, 90, 0.32);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            background: radial-gradient(ellipse at top, rgba(224, 177, 90, 0.16), transparent 42%),
                var(--bg-primary);
        }

        .panel-empty {
            width: 100%;
            padding: 22px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background: var(--bg-card);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .icon {
            display: inline-grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin-bottom: 14px;
            border-radius: 18px;
            background: linear-gradient(160deg, #f0d7a2, var(--accent-deep));
            box-shadow: 0 0 30px rgba(224, 177, 90, 0.28);
            font-size: 30px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 18px;
            line-height: 1.25;
        }

        p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.55;
        }
    </style>
</head>

<body>
    <main class="panel-empty" aria-label="HH3D Auto Tool chỉ hoạt động trên hoathinh3d">
        <div class="icon">🐉</div>
        <h1>Chưa đúng tab</h1>
        <p>Mở trang hoathinh3d, rồi quay lại đây. Công cụ chỉ chạy trên tab đó.</p>
    </main>
</body>

</html>
